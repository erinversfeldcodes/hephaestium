syntax = "proto3";

package hephaestium.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "hephaestium/v1alpha1/common.proto";

// What a workload is told: one isolated run of an agent runtime against one
// ticket. The control plane writes it, and the executor reads it and nothing
// else, so a workload can be run again from this message alone.
message Workload {
  // Assigned by the control plane. Every event of the workload carries it.
  string id = 1;
  Ticket ticket = 2;
  Repository repository = 3;
  AgentRuntime runtime = 4;
  Limits limits = 5;
  // Documents mounted into the workspace read-only: the ticket's spec and the
  // repository's goals.
  repeated GoalDocument goal_documents = 6;
  Approval approval = 7;
  // Set when this workload fixes the failing checks of a pull request an earlier
  // workload opened, on that pull request's branch. Absent for a workload that
  // starts from a ticket alone.
  Revision revision = 8;
  // Set when this workload reviews a pull request an earlier workload opened, at
  // the commit that is the repository's base commit, under one lens. It ends with
  // a verdict and changes nothing. A workload is never a revision and a review at
  // once.
  Review review = 9;
  // Set when this workload judges whether the ticket's goal is met, at the commit that
  // is the repository's base commit (the default branch's current tip). It ends with a
  // verdict and changes nothing. A workload is never a completeness evaluation and a
  // revision or a review.
  Completeness completeness = 10;
  // Set when this workload takes one step of the questioning that follows a ticket found
  // not complete: it reads the ticket's thread and ends by asking the next question,
  // proposing the tickets that close the gap, or saying there is nothing more to ask. It
  // changes nothing. A workload is never a gap step and a revision, a review or a
  // completeness evaluation.
  Gap gap = 11;
  // Set when the ticket is judged after its pull request merges, and closed then if the
  // evidence decides. Its pull request then only refers to the ticket, so that the judgement
  // is of an open ticket and the agent's claim that it resolved the ticket does not stand in
  // place of it.
  bool judged_after_merge = 12;
}

// The ticket, as a maintainer approved it. The executor builds the agent's
// instruction from these fields and does not read the ticket again, so an edit
// after approval cannot reach the agent.
message Ticket {
  int64 number = 1;
  string title = 2;
  string body = 3;
  // The ticket's address on GitHub.
  string url = 4;
  // The ticket this one is a sub-issue of, as the tracker records it. Zero when it is
  // not one.
  int64 parent = 5;
  // How many sub-issues the tracker records under this ticket, and how many of them are
  // completed. A ticket with any is an epic.
  int32 sub_issues = 6;
  int32 sub_issues_completed = 7;
  // The tickets that block this one and are still open, by number.
  repeated int64 blocked_by = 8;
}

// The managed repository, and the exact state of it the workload starts from.
message Repository {
  string owner = 1;
  string name = 2;
  string base_branch = 3;
  // Forty lower-case hexadecimal digits: the commit the workspace is cloned at.
  string base_commit = 4;
  // Where the manifest is, relative to the repository root. Empty means
  // .athenaeum/manifest.toml.
  string manifest_path = 5;
  // What the repository's lock pinned, so a run records the harness it ran under.
  string athenaeum_rev = 6;
  string athenaeum_commit = 7;
}

// Which agent runtime runs the model loop, and where its model is served from.
message AgentRuntime {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CLAUDE_CODE = 1;
    KIND_PI = 2;
    KIND_CORTEX_CODE = 3;
  }

  enum Provider {
    PROVIDER_UNSPECIFIED = 0;
    PROVIDER_ANTHROPIC_SUBSCRIPTION = 1;
    PROVIDER_OPENROUTER = 2;
    PROVIDER_SNOWFLAKE = 3;
  }

  Kind kind = 1;
  Provider provider = 2;
  string model = 3;
  // A Snowflake connection, which must be named. An adapter never falls back
  // to a default connection. Empty for the other runtimes.
  string connection = 4;
}

// What bounds a workload. Both are enforced by the executor, so a workload
// never waits for a person and never runs without an end.
message Limits {
  google.protobuf.Duration timeout = 1;
  Budget budget = 2;
}

message Budget {
  CostUnit unit = 1;
  double amount = 2;
}

message GoalDocument {
  // Relative to the workspace root.
  string path = 1;
  string text = 2;
}

// Who approved the ticket, and when. The control plane has already checked
// that the approver has write access; the executor records it.
message Approval {
  string approved_by = 1;
  google.protobuf.Timestamp approved_at = 2;
}

// A revision of a pull request the runtime opened: the checks that failed, and
// where to push the fix. The repository's base commit is the pull request's head
// when the revision was made, so the workspace holds what the checks ran on.
message Revision {
  int64 pull_request_number = 1;
  string pull_request_url = 2;
  // The pull request's branch. It must be one the runtime made (`heph/...`): a
  // revision is delivered by pushing to it, never by forcing.
  string branch = 3;
  // Which revision this is of the pull request, from 1.
  int32 attempt = 4;
  // What failed. Empty only when the revision exists because the base branch moved
  // (`base_moved` is set), and then there is no check to name.
  repeated FailedCheck failures = 5;
  // Set when the base branch gained commits since the pull request was opened. The
  // revision's first job is to confirm the change still stands on what came in.
  BaseMoved base_moved = 6;
}

// What the base branch gained since a pull request was opened, so the agent can
// reconfirm that the ticket's problem is still there and that its change still does
// what it set out to.
message BaseMoved {
  // The commits that came in, newest first, each as a short id and its subject.
  // Never empty.
  repeated string commits = 1;
  // Files that both those commits and the pull request's change touch.
  repeated string overlapping_files = 2;
}

// One check that failed, and what it said. The excerpt is output a person's code
// or a tool wrote, so it is data to read and never an instruction to follow.
message FailedCheck {
  string name = 1;
  // How it ended: failure, timed_out and the like.
  string result = 2;
  string excerpt = 3;
}

// A judgement of whether a ticket's goal is met, against the state of the default
// branch at the repository's base commit and the evidence gathered since its changes
// merged. The skill travels in the message, so an evaluation can be run again from the
// message alone.
message Completeness {
  // The text of the `ticket-completeness` skill, as the pinned Athenaeum release has it.
  string skill_document = 1;
  // What earlier evaluations of this ticket left owed, so this one is told which items
  // are open and judges those first.
  repeated OwedItem open_items = 2;
  // Set on a second attempt: why the first attempt's verdict was refused by the completeness
  // contract. It is output to read and not an instruction.
  string refused = 3;
}

// One step of the conversation that finds what is missing from a ticket that is not
// complete. Each step stands alone: it reads the whole thread and does not rely on any
// earlier step, so a question that waits for an answer costs nothing.
message Gap {
  // The text of the `close-the-gap` skill, as the pinned Athenaeum release has it.
  string skill_document = 1;
  // Why this step was started, in a sentence: the verdict found the goal not met, a
  // person judged an epic incomplete, a closed ticket was reopened, or a person replied.
  string because = 2;
  // Set on a second attempt: why the first attempt's step was refused by the executor. It is
  // output to read and not an instruction.
  string refused = 3;
}

// One thing a completeness verdict said cannot be settled yet.
message OwedItem {
  string what = 1;
  // The command that produces the evidence.
  string run = 2;
  // The condition under which it can be run.
  string when = 3;
  // The threshold that decides it.
  string settled_by = 4;
}

// A review of a pull request at one commit under one lens. The commit is the
// repository's base commit, so the workspace is what is reviewed and the verdict
// must name it. The lens travels in the message, so a review can be run again
// from the message alone.
message Review {
  int64 pull_request_number = 1;
  string pull_request_url = 2;
  // The pack whose review lens this is. It is a name, never a path.
  string lens = 3;
  // The text of the lens, as the pinned Athenaeum release has it.
  string lens_document = 4;
}
