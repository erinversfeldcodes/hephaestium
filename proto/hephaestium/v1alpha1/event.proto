syntax = "proto3";

package hephaestium.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "hephaestium/v1alpha1/common.proto";

// One thing that happened during a workload. The executor relays events as the
// workload runs, the control plane records them, and the dashboard and the
// replay code read them back. Every agent runtime has a format of its own, and
// its adapter normalises it to this one, so nothing downstream reads a runtime's
// own.
//
// The record of events is the only source of "is it done" (ADR 0004). Rules
// about a whole stream are not in this schema, because they are properties of a
// sequence and not of one message, and are enforced where a stream is read: the
// sequence starts at 1 and has no gaps, `finished` is the last event and
// appears once, and times do not go backwards.
message Event {
  // The workload this belongs to.
  string workload_id = 1;
  // Counted from 1, with no gaps, in the order the events happened.
  uint64 sequence = 2;
  google.protobuf.Timestamp time = 3;

  oneof kind {
    Started started = 10;
    WorkspaceReady workspace_ready = 11;
    AgentMessage agent_message = 12;
    ToolCall tool_call = 13;
    ToolResult tool_result = 14;
    SkillLoaded skill_loaded = 15;
    GateStarted gate_started = 16;
    GateFinished gate_finished = 17;
    Cost cost = 18;
    Heartbeat heartbeat = 19;
    PullRequestOpened pull_request_opened = 20;
    Finished finished = 21;
    StepStarted step_started = 22;
    StepFinished step_finished = 23;
    DeliveryBegan delivery_began = 24;
  }
}

// The executor began.
message Started {
  string executor_version = 1;
}

// The workspace exists and is ready for the agent.
message WorkspaceReady {
  string path = 1;
  // The commit it is checked out at.
  string commit = 2;
}

// Something the agent said, in words.
message AgentMessage {
  string text = 1;
}

// The agent asked for a tool to be run.
message ToolCall {
  // Identifies the call, so its result can be matched to it.
  string id = 1;
  string name = 2;
  google.protobuf.Struct input = 3;
}

// What came back from a tool call.
message ToolResult {
  string call_id = 1;
  string output = 2;
  bool is_error = 3;
}

// The agent loaded a skill. The hash of its text goes into the run record, so
// two runs can be told apart by the skills they had.
message SkillLoaded {
  string name = 1;
  string path = 2;
  // The SHA-256 of the skill's text, as lower-case hexadecimal.
  string sha256 = 3;
}

message GateStarted {
  string name = 1;
}

// A gate ended. The result is Athenaeum's gate result exactly as the gate
// produced it, so the two contracts never disagree.
message GateFinished {
  string name = 1;
  google.protobuf.Struct result = 2;
}

// An amount spent, in the unit the source reports it in. It is never converted
// into another unit.
message Cost {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // The agent runtime or its provider said so.
    SOURCE_REPORTED_BY_RUNTIME = 1;
    // Hephaestium worked it out, for a runtime that reports nothing.
    SOURCE_ESTIMATED_BY_HEPHAESTIUM = 2;
  }

  CostUnit unit = 1;
  double amount = 2;
  Source source = 3;
  // For an amount of tokens, what the runtime said they were made up of. Unset when it did not
  // say. When set, the parts add up to the amount.
  TokenBreakdown breakdown = 4;
}

// The executor started an agent for one step of a run that reads its own change before it
// pushes (ADR 0035): the implementation, a reading under one lens, or the implementing agent
// again for what blocked. What the agent then says and does follows as its own events, so this is
// what tells one agent's events from another's. A run that reads nothing before the push has
// none. The values mean what they do in `Step` in the run record.
message StepStarted {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The agent that made the change.
    KIND_IMPLEMENTATION = 1;
    // An agent that reads the change under one lens.
    KIND_REVIEW = 2;
    // The implementing agent again, told what blocked.
    KIND_REVISION = 3;
  }
  Kind kind = 1;
  // Which round of reading it belongs to. Zero is the first implementation.
  int32 round = 2;
  // For a review: the lens it reads under. Empty otherwise.
  string lens = 3;
}

// The agent of a step ended. A step that is tried again (a reader that could not run) starts
// and ends once for each try.
message StepFinished {
  StepStarted.Kind kind = 1;
  int32 round = 2;
  string lens = 3;
  // For a review: what it ended in (approved, needs_revision or failed), and empty if it left no
  // verdict that passed the review contract.
  string verdict = 4;
}

// The executor is alive. It carries nothing; its arrival is the message.
message Heartbeat {}

// The executor is about to publish: the next thing it does is push the branch and open the pull
// request. It is sent once, before the push, after the gates and the pre-push reading have
// passed. Until it has been seen, nothing of the run is outside the machine the executor runs
// on, so a run whose executor was lost may be started again; after it, the push may have
// happened, and a run that is started again could do it twice. It carries nothing; its arrival
// is the message.
message DeliveryBegan {}

// The executor opened the pull request.
message PullRequestOpened {
  string url = 1;
  int64 number = 2;
  string head_branch = 3;
}

// The workload is over. It is the last event, and there is one.
message Finished {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_COMPLETED = 1;
    OUTCOME_FAILED = 2;
    // It could not go on without a decision it cannot make, so it ended with a
    // question. It did not wait (ADR 0020).
    OUTCOME_BLOCKED = 3;
    OUTCOME_TIMED_OUT = 4;
    OUTCOME_CANCELLED = 5;
  }

  Outcome outcome = 1;
  string reason = 2;
  // For a blocked workload: what it needs answered.
  string question = 3;
}
