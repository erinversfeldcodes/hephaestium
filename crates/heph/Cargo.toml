[package]
name = "heph"
description = "The Hephaestium command-line tool"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version.workspace = true

# Nothing yet. Reporting a version needs only the standard library.
[dependencies]
athenaeum = { git = "https://github.com/erinversfeldcodes/athenaeum", tag = "v0.28.0", version = "0.0.0" }
contracts = { path = "../contracts" }
globset = "0.4.21"
jsonschema = { version = "0.61.2", default-features = false }
pbjson-types = "0.9.0"
rustix = { version = "1.1.6", features = ["process"] }
signal-hook = "0.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25.19"
yaml-rust2 = "0.13.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
