name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every relative link in the documentation resolves
        run: bash scripts/check-doc-links.sh

  # Releases are versioned from commit messages, so every commit a pull
  # request could land on main must be a conventional commit: each commit for
  # a rebase merge, and the pull request title for a squash merge.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/release.sh lint <<<"$TITLE"
      # No agent attribution anywhere a change is described: the title, the body and the
      # whole message of every commit.
      - name: Pull request text carries no agent attribution
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: scripts/release.sh attribution <<<"$TITLE"$'\n'"$BODY"
      - name: Commit messages carry no agent attribution
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git log --no-merges --format=%B "$BASE..$HEAD" | scripts/release.sh attribution
      - name: The attribution check refuses what it should
        run: scripts/test-attribution.sh
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git log --no-merges --format=%s "$BASE..$HEAD" | scripts/release.sh lint
      - name: Pushed commit
        if: github.event_name == 'push'
        run: git log -1 --format=%s | scripts/release.sh lint

  # rustup reads rust-toolchain.toml, so CI and a developer's machine install
  # the same compiler from the same file.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Formatted
        run: cargo fmt --all --check
      - name: Linted, warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tested
        run: cargo test --locked
      - name: The release installer
        run: scripts/test-install-release.sh
      - name: The affected-test command selects what it should
        run: scripts/test-test-changed.sh
      # The other half of the stamping rule: a build that was given no
      # version must not pass for a release.
      - name: A build with no version compiled in is not mistaken for a release
        run: |
          cargo build --locked -p heph
          if scripts/release.sh check-version target/debug/heph 0.0.0-ci; then
            echo "a build with no version passed for a release" >&2
            exit 1
          fi

  # The same script the release workflow runs, with a placeholder version, so
  # the release build is proved on both platforms before a release needs it.
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HEPHAESTIUM_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build, check the version and package
        run: scripts/build-artifact.sh "${{ matrix.target }}" "${{ matrix.platform }}"

  # The repository must pass the baseline it defines. The check is run from this
  # branch's own source, so a change to the check is held to it at once. It runs
  # without --settings: the workflow token cannot read the security settings or
  # the rulesets, so a person with admin access checks those.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: The files and workflows satisfy the baseline
        run: cargo run --locked --quiet -p heph -- baseline check

  # The runtime's contracts are Protobuf. They are held to buf's lint, on a pull
  # request to buf's check that nothing breaks against the base branch, and to
  # the cases every reader of them is graded by. The reader here is strict, which
  # buf convert is not: it discards a misspelt field.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUF_VERSION: v1.70.0
      BUF_SHA256: e2bbcdd324da09c16a15963dc2dae0525c955c05dc118223cf732f4f7509c5e6
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install buf
        run: |
          curl -fsSL -o buf "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  buf" | sha256sum --check --strict
          sudo install -m 0755 buf /usr/local/bin/buf
      - name: Lint
        run: buf lint
      - name: Nothing breaks against the base branch
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "origin/${BASE_REF}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#branch=origin/${BASE_REF}"
          else
            echo "the base branch has no contracts yet, so nothing can break"
          fi
      - name: The strict reader accepts and rejects what the cases say
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet 'protobuf==5.29.5'
          buf build -o /tmp/runtime.binpb
          /tmp/venv/bin/python scripts/check-contract-cases.py /tmp/runtime.binpb cases/runtime

  # The control plane keeps the record of every workload in Postgres, so its
  # tests run against a real one.
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost/hephaestium_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      # Before anything migrates, so a clash reads as two file names and not as an Ecto error
      # partway through. On a push the base is the commit itself, so only a shared version can
      # fail.
      - name: Migration versions are unique and later than the base's
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: scripts/check-migrations.sh "$BASE"
      - name: The migration check refuses what it should
        working-directory: .
        run: scripts/test-check-migrations.sh
      - name: Dependencies, exactly as locked
        run: mix deps.get --check-locked
      - name: Formatted
        run: mix format --check-formatted
      - name: Compiled, warnings denied
        run: mix compile --warnings-as-errors
      - name: Tested
        run: mix test

  # The dashboard is a single-page app the control plane serves. Its types are checked and its
  # tests run, and it must build, which is what the image then includes.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
      - name: Dependencies, exactly as locked
        run: npm ci
      - name: Type-checked
        run: npm run typecheck
      - name: Tested
        run: npm test
      - name: Built
        run: npm run build

  # The dashboard in a real browser: by keyboard, in both themes and at 390px, with the control
  # plane's API answered from the fixtures. jsdom has no layout, focus or colour scheme, so only
  # this can show those. It is reported but is not yet in the `ci` gate: a browser test that
  # flakes would block every merge, so it joins the gate's `needs` once it has passed ten runs in
  # a row. A test that fails once is retried once, and the retry is reported as a warning.
  # Measured locally: build under 1s, the whole suite 66s wall (128 tests, slowest 9.7s). On a runner
  # the install of Chromium and its libraries adds a few minutes, so 15 minutes is a wide margin;
  # past it GitHub cancels the job, which is reported as failed and costs at most 15 runner minutes.
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
      - name: Dependencies, exactly as locked
        run: npm ci
      # The browser is downloaded once for a version of Playwright, which the lock file names.
      - name: Chromium, cached between runs
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      - name: Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: The system libraries Chromium needs
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Screenshots of each page, theme and width, for a person to look at
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: dashboard/browser-screenshots
          if-no-files-found: warn
      - name: Traces of the tests that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-traces
          path: dashboard/browser-results
          if-no-files-found: ignore

  # The control plane is deployed as a container image, so the image is built here, and the
  # release inside it is started against a real Postgres the way the platform starts it: the
  # migrate command first, then the server. That the health check says 200 with the database
  # up and 503 with it stopped is checked on the running image, not only in the unit tests.
  control-plane-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: ecto://postgres:postgres@localhost/hephaestium_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --file control-plane/Dockerfile --build-arg HEPHAESTIUM_COMMIT="$GITHUB_SHA" --tag control-plane:ci .
      - name: The image carries a heph that runs and builds a workload
        run: control-plane/image-test/check.sh control-plane:ci
      - name: The migrate command brings an empty database to the current schema
        run: |
          psql -h localhost -U postgres -c 'create database hephaestium_image'
          docker run --rm --network host --env DATABASE_URL control-plane:ci /app/bin/migrate
          tables=$(psql -h localhost -U postgres -d hephaestium_image -tAc \
            "select string_agg(tablename, ' ' order by tablename) from pg_tables where schemaname = 'public'")
          echo "tables: $tables"
          for table in events oban_jobs workloads; do
            case " $tables " in
              *" $table "*) ;;
              *) echo "the migrated database has no $table table" >&2; exit 1 ;;
            esac
          done
      - name: The image starts, and is healthy with the database up
        run: |
          docker run --detach --name control-plane --network host \
            --env DATABASE_URL --env HEPH_HEALTH_PORT=8080 control-plane:ci
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          echo "the health check never answered 200 (last answer: $code)" >&2
          docker logs control-plane >&2
          exit 1
      # The image holds the built dashboard, and the API serves it. The key and client values
      # are placeholders for this run only; nothing signs in.
      - name: The image serves the dashboard on the API's listener, and the API keeps its paths
        run: |
          # The first container holds the default Erlang node name on the host's network, so
          # this one is named apart.
          docker run --detach --name control-plane-api --network host \
            --env RELEASE_NODE=control_plane_api \
            --env DATABASE_URL --env HEPH_HEALTH_PORT=8081 --env HEPH_API_PORT=8082 \
            --env HEPH_API_SECRET_KEY_BASE=ci-only-key-ci-only-key-ci-only-key-0000 \
            --env HEPH_API_GITHUB_CLIENT_ID=ci --env HEPH_API_GITHUB_CLIENT_SECRET=ci \
            --env HEPH_API_BASE_URL=http://localhost:8082 control-plane:ci
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/ || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            echo "the dashboard was never served (last answer: $code)" >&2
            docker logs control-plane-api >&2
            exit 1
          fi
          curl -fsS http://localhost:8082/tickets/o/r/1 | grep -q '<div id="root">'
          script=$(curl -fsS http://localhost:8082/ | grep -o '/assets/[^"]*\.js' | head -1)
          [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8082$script")" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/session)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is http://localhost:8082/assets/../../etc/passwd)" != 200 ]
          docker rm --force control-plane-api
      - name: The health check says 503 once the database is stopped
        run: |
          docker stop "$(docker ps --quiet --filter ancestor=postgres:16)"
          for attempt in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$code" = 503 ] && exit 0
            sleep 2
          done
          echo "the health check never answered 503 (last answer: $code)" >&2
          docker logs control-plane >&2
          exit 1

  # The deploy, cleanup and sweep scripts, against stand-ins for Fly, Neon and GitHub: what they
  # ask for and refuse, not whether the real services answer as the fixtures do.
  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linted
        run: |
          shellcheck -x -P SCRIPTDIR scripts/deploy-control-plane.sh scripts/cleanup-preview.sh \
            scripts/sweep-preview-orphans.sh scripts/test-deploy-scripts.sh scripts/lib/*.sh
      - name: Tested
        run: scripts/test-deploy-scripts.sh

  # A pull request from this repository, once the checks that matter have passed, gets a Fly app
  # of its own on a branch of the staging Neon project, both deleted when it closes (see
  # cleanup-preview.yml). It is not part of the `ci` gate below: a preview that fails to deploy is
  # looked at, but a pull request from a fork has no secrets and must not be blocked by one.
  deploy-preview:
    needs: [control-plane, dashboard, control-plane-image, deploy-scripts]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEON_STAGING_API_KEY: ${{ secrets.NEON_STAGING_API_KEY }}
      NEON_STAGING_PROJECT_ID: ${{ secrets.NEON_STAGING_PROJECT_ID }}
      HEPH_API_SECRET_KEY_BASE: ${{ secrets.HEPH_API_SECRET_KEY_BASE }}
      HEPH_API_GITHUB_CLIENT_ID: ${{ secrets.HEPH_API_GITHUB_CLIENT_ID }}
      HEPH_API_GITHUB_CLIENT_SECRET: ${{ secrets.HEPH_API_GITHUB_CLIENT_SECRET }}
      PR_HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.67
      # The action installs `flyctl` only; the scripts call `fly`.
      - name: Alias fly -> flyctl
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v flyctl)" "$HOME/.local/bin/fly"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy the preview
        run: scripts/deploy-control-plane.sh preview --branch "$PR_HEAD_REF"

  ci:
    if: always()
    needs:
      [
        docs,
        commits,
        rust,
        baseline,
        contracts,
        artifacts,
        control-plane,
        dashboard,
        control-plane-image,
        deploy-scripts,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every other job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended as: $result" >&2
              exit 1
            fi
          done
