version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: mix
    directory: /control-plane
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      mix:
        update-types: [minor, patch]
